<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chorus — promo</title>
<style>
  @font-face {
    font-family: "Nunito";
    src: url("fonts/Nunito-VF.ttf") format("truetype");
    font-weight: 200 1000;
    font-style: normal;
  }
  html, body { margin: 0; height: 100%; background: #EDE6D8; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; display: block; }
  #play {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    font: 800 16px "Nunito", ui-rounded, system-ui, sans-serif; color: #26211a;
    background: #FFFCF6; border: 3px solid #26211a; border-radius: 999px;
    padding: 9px 20px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="play">&#9654; Play with sound</button>
<script>
"use strict";


/*
  Chorus promo. Every frame is drawn by draw(ctx, t): the picture at time t is a pure function of
  t — nothing carried between frames, no image files — and the soundtrack is synthesized from a
  score by this same page. promo/render.swift renders both offline and muxes the MP4.
*/

// ---------------------------------------------------------------- canvas & palette
const W = 1920, H = 1080;
const C = {
  ink: "#26211a", paperTop: "#F6F1E7", paperBot: "#ECE4D6", fill: "#FFFCF6", win: "#F2EBDF",
  orange: "#DB8042", gold: "#D4A129", faint: "rgba(38,33,26,0.30)", hair: "rgba(38,33,26,0.16)",
};
const FONT = '"Nunito", ui-rounded, system-ui, sans-serif';

// ---------------------------------------------------------------- math
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = x => x * x * (3 - 2 * x);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInOutCubic = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOutBack = (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const bump = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));      // 0 → 1 → 0 over [a, a+d]
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = (a, b = 0, c = 0) => mulberry32((a * 73856093) ^ (b * 19349663) ^ (c * 83492791))();

// ---------------------------------------------------------------- hand-drawn line "boil"
// Contours re-wiggle 10×/s, like pencil lines redrawn every few frames: alive, never jittery.
const BOIL_FPS = 10;
function contourNoise(id, t, amp) {
  const b = Math.floor(t * BOIL_FPS);
  const p1 = rand(id, b, 1) * TAU, p2 = rand(id, b, 2) * TAU, p3 = rand(id, b, 3) * TAU;
  return u => amp * (0.55 * Math.sin(TAU * 2 * u + p1) + 0.3 * Math.sin(TAU * 3 * u + p2) + 0.15 * Math.sin(TAU * 5 * u + p3));
}

// Closed contours are sampled as points with outward normals, so noise can push them in/out.
function sampleCircle(cx, cy, r, n = 96) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (i / n) * TAU, nx = Math.cos(a), ny = Math.sin(a);
    pts.push({ x: cx + r * nx, y: cy + r * ny, nx, ny });
  }
  return pts;
}

// Rounded polygon; vertices clockwise on screen. Handles reflex corners (a speech-bubble tail).
function roundedPoly(vs, rs, n = 110) {
  const m = vs.length, corners = [];
  for (let i = 0; i < m; i++) {
    const P = vs[(i - 1 + m) % m], V = vs[i], N = vs[(i + 1) % m];
    let ax = P[0] - V[0], ay = P[1] - V[1]; const al = Math.hypot(ax, ay); ax /= al; ay /= al;
    let bx = N[0] - V[0], by = N[1] - V[1]; const bl = Math.hypot(bx, by); bx /= bl; by /= bl;
    const theta = Math.acos(clamp(ax * bx + ay * by, -1, 1));
    const r = Math.min(rs[i], 0.45 * Math.min(al, bl) * Math.tan(theta / 2));
    const d = r / Math.tan(theta / 2), cd = r / Math.sin(theta / 2);
    let hx = ax + bx, hy = ay + by; const hl = Math.hypot(hx, hy) || 1; hx /= hl; hy /= hl;
    const c = [V[0] + hx * cd, V[1] + hy * cd];
    const t1 = [V[0] + ax * d, V[1] + ay * d], t2 = [V[0] + bx * d, V[1] + by * d];
    const reflex = (V[0] - P[0]) * (N[1] - V[1]) - (V[1] - P[1]) * (N[0] - V[0]) < 0;
    const a1 = Math.atan2(t1[1] - c[1], t1[0] - c[0]);
    let sweep = Math.atan2(t2[1] - c[1], t2[0] - c[0]) - a1;
    while (sweep > Math.PI) sweep -= TAU;
    while (sweep < -Math.PI) sweep += TAU;
    corners.push({ c, r, a1, sweep, t1, t2, reflex });
  }
  const pieces = [];
  for (let i = 0; i < m; i++) {
    const k = corners[i], nk = corners[(i + 1) % m];
    pieces.push({ arc: k, len: Math.abs(k.sweep) * k.r });
    pieces.push({ a: k.t2, b: nk.t1, len: Math.hypot(nk.t1[0] - k.t2[0], nk.t1[1] - k.t2[1]) });
  }
  const total = pieces.reduce((s, p) => s + p.len, 0), pts = [];
  for (let i = 0; i < n; i++) {
    let d = (i / n) * total;
    for (let j = 0; j < pieces.length; j++) {
      const p = pieces[j];
      if (d <= p.len || j === pieces.length - 1) {
        const f = p.len ? clamp(d / p.len) : 0;
        if (p.arc) {
          const k = p.arc, a = k.a1 + k.sweep * f, ux = Math.cos(a), uy = Math.sin(a), s = k.reflex ? -1 : 1;
          pts.push({ x: k.c[0] + k.r * ux, y: k.c[1] + k.r * uy, nx: s * ux, ny: s * uy });
        } else {
          const ex = p.b[0] - p.a[0], ey = p.b[1] - p.a[1], el = Math.hypot(ex, ey) || 1;
          pts.push({ x: p.a[0] + ex * f, y: p.a[1] + ey * f, nx: ey / el, ny: -ex / el });
        }
        break;
      }
      d -= p.len;
    }
  }
  return pts;
}
const rrect = (x, y, w, h, r, n) => roundedPoly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], [r, r, r, r], n);

function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function polyLen(q) {
  let L = 0;
  for (let i = 0; i < q.length; i++) { const a = q[i], b = q[(i + 1) % q.length]; L += Math.hypot(b[0] - a[0], b[1] - a[1]); }
  return L;
}

// Draw a closed contour. o: { id, t, amp, fill, fillAlpha, stroke, lw, draw (0..1 draw-on) }
function shape(ctx, pts, o) {
  const dp = o.draw === undefined ? 1 : o.draw;
  if (dp <= 0) return;
  const off = o.amp ? contourNoise(o.id, o.t, o.amp) : null, n = pts.length, q = new Array(n);
  for (let i = 0; i < n; i++) { const d = off ? off(i / n) : 0; q[i] = [pts[i].x + pts[i].nx * d, pts[i].y + pts[i].ny * d]; }
  ctx.beginPath();
  const mx = i => (q[i][0] + q[(i + 1) % n][0]) / 2, my = i => (q[i][1] + q[(i + 1) % n][1]) / 2;
  ctx.moveTo(mx(n - 1), my(n - 1));
  for (let i = 0; i < n; i++) ctx.quadraticCurveTo(q[i][0], q[i][1], mx(i), my(i));
  ctx.closePath();
  if (o.fill) {
    ctx.save();
    ctx.globalAlpha *= o.fillAlpha === undefined ? smooth(seg(dp, 0.45, 1)) : o.fillAlpha;
    ctx.fillStyle = o.fill; ctx.fill();
    ctx.restore();
  }
  if (o.stroke) {
    ctx.save();
    ctx.lineWidth = o.lw || 6; ctx.strokeStyle = o.stroke; ctx.lineJoin = "round"; ctx.lineCap = "round";
    if (dp < 1) { const L = polyLen(q); ctx.setLineDash([L, L + 20]); ctx.lineDashOffset = L * (1 - dp); }
    ctx.stroke();
    ctx.restore();
  }
}

// A slightly bowed, boiling straight line.
function wline(ctx, x1, y1, x2, y2, o) {
  const b = Math.floor(o.t * BOIL_FPS), a = o.amp || 0, j = k => (rand(o.id, b, k) - 0.5) * 2 * a;
  const ax = x1 + j(1) * 0.4, ay = y1 + j(2) * 0.4, bx = x2 + j(3) * 0.4, by = y2 + j(4) * 0.4;
  ctx.save();
  ctx.lineWidth = o.lw || 6; ctx.strokeStyle = o.stroke || C.ink; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(ax, ay);
  ctx.quadraticCurveTo((ax + bx) / 2 + j(5), (ay + by) / 2 + j(6), bx, by);
  ctx.stroke();
  ctx.restore();
}

// A wavy "line of writing". o: { id, t, amp, wave, lw, stroke, alpha, draw }
function scribble(ctx, x, y, len, o) {
  const dp = o.draw === undefined ? 1 : o.draw;
  if (dp <= 0 || len <= 0) return;
  const b = Math.floor(o.t * BOIL_FPS), ph = rand(o.id, 0, 7) * TAU, amp = o.amp === undefined ? 3 : o.amp;
  const wave = o.wave || 34, pts = [];
  for (let s = 0; s <= len; s += 6) {
    pts.push([x + s, y + amp * Math.sin(ph + (s / wave) * TAU) + (rand(o.id, b, s) - 0.5) * 1.1]);
  }
  const cut = Math.max(2, Math.ceil(pts.length * dp));
  ctx.save();
  ctx.globalAlpha *= o.alpha === undefined ? 1 : o.alpha;
  ctx.lineWidth = o.lw || 6; ctx.strokeStyle = o.stroke || C.ink; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < cut; i++) {
    const p = pts[i], q = pts[i - 1];
    ctx.quadraticCurveTo(q[0], q[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------- paper
let GRAIN = null, GRAIN_PAT = null;
function drawPaper(ctx) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.paperTop); g.addColorStop(1, C.paperBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (!GRAIN) {
    GRAIN = document.createElement("canvas"); GRAIN.width = GRAIN.height = 256;
    const x = GRAIN.getContext("2d"), r = mulberry32(7);
    for (let i = 0; i < 2600; i++) {
      x.fillStyle = `rgba(90,70,40,${0.02 + r() * 0.05})`;
      x.fillRect(r() * 256, r() * 256, 1 + r() * 1.4, 1 + r() * 1.4);
    }
  }
  if (!GRAIN_PAT) GRAIN_PAT = ctx.createPattern(GRAIN, "repeat");
  ctx.fillStyle = GRAIN_PAT; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, "rgba(120,95,60,0)"); v.addColorStop(1, "rgba(120,95,60,0.10)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ================================================================ THE FILM
// Seven beats, one continuous timeline. Everything below is a function of the global time t.

// ---------------------------------------------------------------- timeline anchors (seconds)
const T = {
  end: 37.0,
  // 1 — the problem: three tabs, the same question three times
  type0: [0.95, 1.4], paste: [1.72, 2.32], fluster: 2.62,
  merge0: 3.75, merge1: 4.65,
  // 2 — ask once
  typeQ: [5.5, 6.65], send: 6.88,
  cardPop: 7.0, burst: 7.23, depart: [7.26, 7.36, 7.56], arrive: [8.0, 8.05, 8.1],
  answer: [8.6, 8.95, 9.3], chord: 9.9,
  // 3 — compare
  cmpClick: 13.1, cmpIn: 13.3, cmpLine: [14.0, 14.65], cmpOut: 16.85,
  // 4 — crown
  trophyIcons: 17.4, crownClick: 18.3, crownLand: 18.9,
  // 5 — from anywhere, ask just one
  away: 21.45, keys: 22.3, qiOpen: 22.8, at: 23.25, pick: [23.3, 23.65, 23.95], choose: 24.25,
  typeQ2: [24.5, 25.3], send2: 25.5, back: 25.75, soloDepart: 26.35, soloArrive: 26.85, solo: 27.35,
  // 6 — your own accounts
  acct: 28.7, pills: [29.0, 29.2, 29.4], key: 30.2, strike: 30.65, drop: 31.2,
  // 7 — curtain call
  gather: 32.3, bow: 33.6, word: 34.05,
};

const Q1 = "What should I name my new kitten?";
const Q2 = "More names like Sir Pounce?";
const NAMES = ["Mochi!", "Biscuit!", "Sir Pounce!"];
const SOLO_NAME = "Baron Floof!";

const CAPTIONS = [
  [0.9, 3.7, [{ text: "Asking the same thing " }, { text: "three times", underline: true }, { text: "?" }]],
  [4.2, 5.45, [{ text: "One window. " }, { text: "Every AI.", underline: true }]],
  [9.95, 12.95, [{ text: "Ask " }, { text: "once", underline: true }, { text: ". They all answer." }]],
  [13.45, 17.05, [{ text: "See where they " }, { text: "agree", underline: true }, { text: ", and where they don't." }]],
  [17.95, 21.25, [{ text: "Crown the " }, { text: "best", underline: true }, { text: " answer." }]],
  [22.25, 28.5, [{ text: "Ask from " }, { text: "anywhere", underline: true }, { text: ". Or ask just one." }]],
  [28.95, 32.15, [{ text: "Your own AI accounts. " }, { text: "No API keys.", underline: true }]],
];

// ---------------------------------------------------------------- helpers
function keyframes(t, ks, ease = easeInOutCubic) {
  if (t <= ks[0][0]) return ks[0].slice(1);
  for (let i = 1; i < ks.length; i++) {
    if (t < ks[i][0]) {
      const a = ks[i - 1], b = ks[i], k = ease(seg(t, a[0], b[0]));
      return a.slice(1).map((v, j) => lerp(v, b[j + 1], k));
    }
  }
  return ks[ks.length - 1].slice(1);
}
function typeTimes(str, t0, t1, seed) {
  const r = mulberry32(seed), ws = [];
  let sum = 0;
  for (const ch of str) { const w = 0.7 + r() * 0.6 + (ch === " " ? 0.45 : 0); ws.push(w); sum += w; }
  let acc = t0;
  return ws.map(w => (acc += (w / sum) * (t1 - t0)));
}
const typed = (times, t) => { let n = 0; for (const x of times) if (x <= t) n++; return n; };
const TT_TAB0 = typeTimes(Q1, T.type0[0], T.type0[1], 3);
const TT_Q1 = typeTimes(Q1, T.typeQ[0], T.typeQ[1], 42);
const TT_Q2 = typeTimes(Q2, T.typeQ2[0], T.typeQ2[1], 7);
function bez3(p0, p1, p2, p3, k) {
  const u = 1 - k, a = u * u * u, b = 3 * u * u * k, c = 3 * u * k * k, d = k * k * k;
  return [a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0], a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1]];
}
function text(ctx, str, x, y, size, weight = 800, color = C.ink, align = "left") {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.fillText(str, x, y);
  ctx.textAlign = "left";
}
function checkMark(ctx, x, y, s, color, lw = 6, p = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(-12, 0);
  const k1 = clamp(p * 2), k2 = clamp(p * 2 - 1);
  ctx.lineTo(-12 + 8 * k1, 9 * k1);
  if (k2 > 0) ctx.lineTo(-4 + 18 * k2, 9 - 22 * k2);
  ctx.stroke(); ctx.restore();
}
function sparkleGlyph(ctx, x, y, r, color) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = color; ctx.beginPath();
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * TAU - Math.PI / 2, b = a + TAU / 8;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(b) * r * 0.32, Math.sin(b) * r * 0.32);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}


// A soft drop shadow under a rounded rect. Skipped when the layer is (nearly) invisible: WebKit
// draws a shadowed fill at FULL opacity when globalAlpha is exactly 0 (a fading window left a
// solid ghost of itself on the end card), while any alpha above zero behaves.
function softShadow(ctx, x, y, w, h, r, fill, blur, oy, color) {
  if (ctx.globalAlpha < 0.002) return;
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetY = oy;
  ctx.fillStyle = fill; rrPath(ctx, x, y, w, h, r); ctx.fill();
  ctx.restore();
}

// ---------------------------------------------------------------- layout
const LAY = (() => {
  const win = { x: 240, y: 86, w: 1440, h: 720, r: 38 };
  const pad = 28, gap = 24, top = 60, ph = 520;
  const pw = (win.w - pad * 2 - gap * 2) / 3;
  const panels = [0, 1, 2].map(i => ({ x: win.x + pad + i * (pw + gap), y: win.y + top, w: pw, h: ph, r: 24 }));
  const comp = { x: win.x + pad, y: win.y + win.h - pad - 70, w: win.w - pad * 2, h: 70, r: 35 };
  return { win, panels, comp };
})();
const WIN_C = [LAY.win.x + LAY.win.w / 2, LAY.win.y + LAY.win.h / 2];
const WIN_PTS = rrect(LAY.win.x, LAY.win.y, LAY.win.w, LAY.win.h, LAY.win.r, 190);
const COMP_PTS = rrect(LAY.comp.x, LAY.comp.y, LAY.comp.w, LAY.comp.h, LAY.comp.r, 160);
const TEXT_X = LAY.comp.x + 196;                                   // composer text starts right of "Compare"
const SEND_XY = [LAY.comp.x + LAY.comp.w - 40, LAY.comp.y + 35];
const CMP_XY = [LAY.comp.x + 97, LAY.comp.y + 35];

// Scene 1 tabs: three separate browser windows that later become the three panels.
const TABS = [0, 1, 2].map(i => ({ x: 110 + i * 590, y: 166, w: 520, h: 580, r: 26, rot: [-0.035, 0.022, -0.028][i] }));
const mergeK = t => easeInOutCubic(seg(t, T.merge0, T.merge1));
function rectAt(i, t) {
  const m = mergeK(t), a = TABS[i], b = LAY.panels[i];
  return { x: lerp(a.x, b.x, m), y: lerp(a.y, b.y, m), w: lerp(a.w, b.w, m), h: lerp(a.h, b.h, m), r: lerp(a.r, b.r, m), rot: a.rot * (1 - m), m };
}
function toGlobal(r, lx, ly) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = lx - cx, dy = ly - cy, c = Math.cos(r.rot), s = Math.sin(r.rot);
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}
const TAB_IN = [0, 1, 2].map(i => toGlobal(rectAt(i, 0), TABS[i].x + 96, TABS[i].y + TABS[i].h - 49));

// ---------------------------------------------------------------- characters
const LW = 11, LEG = 34;
const BODY = [{ kind: "circle", w: 196, h: 196 }, { kind: "rect", w: 186, h: 178, r: 36 }, { kind: "tri", w: 208, h: 184 }];
const BODY_PTS = BODY.map(b => {
  const top = -LEG - b.h, bot = -LEG;
  if (b.kind === "circle") return sampleCircle(0, -LEG - b.h / 2, b.h / 2, 96);
  if (b.kind === "rect") return rrect(-b.w / 2, top, b.w, b.h, b.r, 120);
  return roundedPoly([[0, top], [b.w / 2, bot], [-b.w / 2, bot]], [34, 22, 22], 110);
});
const EYE_Y = [-LEG - 98 - 4, -LEG - 89 + 2, -LEG - 184 * 0.32];
const EYE_DX = [15, 15, 14], LEG_DX = [16, 16, 18];
const CX = LAY.panels.map(p => p.x + p.w / 2);
const FEET = LAY.panels[0].y + LAY.panels[0].h - 30;
const headTop = i => FEET - LEG - BODY[i].h;
const FORM = [[806, 664], [960, 664], [1114, 664]];      // the app-icon line-up for the curtain call

function drawChar(ctx, i, s, t, opt = {}) {
  const alpha = s.alpha === undefined ? 1 : s.alpha;
  if (alpha <= 0) return;
  const lw = opt.lw || LW, hop = s.hop || 0, sc = s.scale || 1;
  ctx.save();
  ctx.globalAlpha *= alpha;
  if (!opt.noShadow) {
    const k = (1 - clamp(hop / 110) * 0.55) * sc;
    ctx.fillStyle = "rgba(38,33,26,0.08)";
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 5, 74 * k, 9 * k, 0, 0, TAU); ctx.fill();
  }
  ctx.translate(s.x, s.y - hop * sc);
  ctx.rotate(s.rot || 0);
  ctx.scale((s.sx || 1) * sc, (s.sy || 1) * sc);
  const id = 100 + i * 10, tuck = clamp(hop / 40) * 9;
  for (const side of [-1, 1]) {

  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const v = clamp(chans[c][i] * gain, -1, 1); dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  const bytes = new Uint8Array(dv.buffer);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// ================================================================ BOOT: export hooks + live preview
window.addEventListener("error", e => { window.__error = String(e.message || e); });
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
window.__duration = DURATION;
window.__frame = t => {
  try { draw(ctx, t); return canvas.toDataURL("image/png"); }
  catch (e) { return "ERR " + e.message + " @ " + (e.stack || "").split("\n")[1]; }
};
window.__audioWav = async (mix = MIX, normalize = true) => {
  const sr = 48000, oac = new OfflineAudioContext(2, Math.ceil(sr * DURATION), sr);
  buildAudio(oac, score(), 0, DURATION, mix);
  return wavBase64(await oac.startRendering(), normalize);
};
let liveStart = performance.now(), liveAudio = null;
function tick(now) {
  const t = ((now - liveStart) / 1000) % (DURATION + 1.5);
  draw(ctx, Math.min(t, DURATION - 1e-3));
  requestAnimationFrame(tick);
}
document.getElementById("play").addEventListener("click", () => {
  if (liveAudio) liveAudio.close();
  liveAudio = new (window.AudioContext || window.webkitAudioContext)();
  buildAudio(liveAudio, score(), liveAudio.currentTime + 0.08, DURATION);
  liveStart = performance.now() + 80;
});
(async () => {
  try { await document.fonts.load(`900 72px ${FONT}`); await document.fonts.load(`600 30px ${FONT}`); } catch (e) {}
  ctx.font = `600 30px ${FONT}`;
  TT_W = ctx.measureText(Q1).width;
  window.__ready = true;
  requestAnimationFrame(tick);
})();
